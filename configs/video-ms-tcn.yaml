# Per-video loading: one whole video per iteration (batch_size forced to 1).
# Intended for the ConvNeXt + MS-TCN temporal model, which consumes the full
# frame sequence of a video and predicts per-frame labels.

project:
  name: phase-classification
  seed: 42
  output_dir: outputs
  save_checkpoints: true

dataset:
  dataset_variant: cholect50-crossval
  root_dir: /home/andreikrivenko/dataset/CholecT50
  test_fold: 1
  sequence_length: 1 # ignored in video mode; each item is a whole video
  augmentations: [original]
  image_size: [256, 448]
  normalize: true
  loader: video

dataloader:
  batch_size: 32 # overridden to 1 by the video loader
  num_workers: 4
  shuffle: true
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  drop_last: false

model:
  name: convnext-ms-tcn
  # ConvNeXt frame encoder + MS-TCN temporal head (see models/ms_tcn.py).
  params: { variant: tiny, pretrained: true, freeze_backbone: false, num_stages: 4, num_layers: 10, num_f_maps: 64, kernel_size: 3 }
  num_classes:
    phase: 7
    tool: 6
    verb: 10
    target: 15
    triplet: 100

training:
  epochs: 20
  batch_size: 32 # unused in video mode (batch_size=1 per video)
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  momentum: 0.9
  scheduler: none
  step_size: 10
  gamma: 0.1
  loss: cross_entropy
  heads: [phase]
  grad_clip_norm: null

validation:
  metrics: [jaccard, f1_macro, f1_per_class, mean_accuracy, accuracy_per_class, edit_score]
  checkpoint_path: null
  top_k: 1
  batch_size: null

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: phase_classification
  run_name: null
  tags: {}
  log_artifacts_to: null
  s3_endpoint_url: http://localhost:9000
  aws_access_key_id: minio
  aws_secret_access_key: miniopass
  aws_region: us-east-1

runtime:
  device: cuda
  cuda_device: 0
  mixed_precision: fp32
  seed: 42
  num_workers: 4
