# Offline adaptation of Meta-SurDiff: frozen SurgCLIP features -> MS-TCN coarse
# phase predictions -> meta-weighted conditional classification diffusion.
# Run: uv run phase-cls train configs/surgclip-meta-surdiff.yaml

project:
  name: surgclip-meta-surdiff
  output_dir: outputs/surgclip-meta-surdiff/fold1
  save_checkpoints: true

dataset:
  dataset_variant: cholect50-crossval
  root_dir: /home/vscode/dataset/CholecT50
  feature_cache: outputs/surgclip-diffusion/fold1/surgclip_embeddings.pt
  test_fold: 1

dataloader:
  batch_size: 1
  num_workers: 0
  shuffle: true
  pin_memory: false
  persistent_workers: false

model:
  name: surgclip-meta-surdiff
  params:
    feature_dim: 256
    num_stages: 3
    num_layers: 8
    num_f_maps: 64
    kernel_size: 3
    diffusion_timesteps: 100
    diffusion_hidden_dim: 512
    beta_start: 0.0001
    beta_end: 0.02
    meta_hidden_dim: 100
    meta_epochs: 20
    meta_steps_per_epoch: 100
    meta_learning_rate: 0.001
    theta_learning_rate: 0.00001
    inner_learning_rate: 0.00001
    crop_length: 256
    sampling_steps: 100
  num_classes:
    phase: 7

training:
  heads: [phase]
  epochs: 100
  optimizer: adamw
  learning_rate: 0.01
  weight_decay: 0.01
  scheduler: cosine
  class_weighting: none

validation:
  metrics: [f1_macro, jaccard, mean_accuracy, edit_score]

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: SurgCLIP Meta-SurDiff CholecT50
  run_name: surgclip-meta-surdiff-offline-fold1

runtime:
  device: cuda
  mixed_precision: fp32
  seed: 42
