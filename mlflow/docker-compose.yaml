version: "3.9"

# MLflow Tracking Server: PostgreSQL (backend store) + MinIO (S3 artifact store)
# together with a one-shot createbucket job. All values are parameterized and
# read from mlflow/.env (${VAR:-default}).
#
#   docker compose up -d   # from mlflow/  (creates the S3 bucket automatically)
#   open http://localhost:5000
#
# Point your training run here:
#   mlflow:
#     tracking_uri: http://localhost:5000
#     experiment_name: phase_classification

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopass}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set mlflow http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-miniopass} &&
      mc mb --ignore-existing mlflow/${MINIO_BUCKET:-mlflow} ||
      exit 0
      "

  mlflow:
    image: ${MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:latest}
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniopass}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      --default-artifact-root s3://${MINIO_BUCKET:-mlflow}/
      --host 0.0.0.0

volumes:
  pgdata:
  minio:
